<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>BLIND CORNER</title>
<style>
  :root { --cream:#f6e7cb; --ink:#1b1724; --hot:#ffd23f; }
  html,body { margin:0; height:100%; overflow:hidden; background:#bfe3e6; touch-action:none;
    font-family:"Arial Black","Helvetica Neue",Impact,system-ui,sans-serif; color:var(--cream);
    -webkit-user-select:none; user-select:none; }
  canvas#c { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .hud { position:fixed; pointer-events:none; font-style:italic; text-transform:uppercase;
    text-shadow:3px 3px 0 var(--ink); letter-spacing:.02em; }
  #score { top:16px; left:20px; font-size:50px; line-height:1; }
  #score small { display:block; font-size:13px; letter-spacing:.2em; }
  #speed { top:16px; right:20px; font-size:44px; text-align:right; line-height:1; }
  #speed small { display:block; font-size:13px; letter-spacing:.2em; }
  #drift { left:50%; top:22%; transform:translateX(-50%) rotate(-4deg); font-size:32px; color:var(--hot);
    opacity:0; transition:opacity .15s; white-space:nowrap; }
  #count { left:50%; top:30%; transform:translate(-50%,-50%) rotate(-5deg); font-size:clamp(80px,18vw,200px); color:var(--hot);
    text-shadow:6px 6px 0 var(--ink); opacity:0; }
  #overlay { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    padding-top:9vh; box-sizing:border-box; text-align:center; pointer-events:none; font-style:italic; text-transform:uppercase; }
  #title { font-size:clamp(56px,13vw,150px); line-height:.82; transform:rotate(-5deg);
    text-shadow:6px 6px 0 var(--ink), 12px 12px 0 rgba(27,23,36,.35); }
  #title span { color:var(--hot); display:block; }
  #sub { margin-top:30px; font-size:clamp(14px,2.4vw,22px); letter-spacing:.16em; text-shadow:2px 2px 0 var(--ink); padding:0 12px; }
  #sub b { color:var(--hot); }
  #hint { margin-top:12px; font-size:clamp(10px,1.5vw,13px); letter-spacing:.18em; text-shadow:2px 2px 0 var(--ink);
    font-family:ui-monospace,Menlo,monospace; font-style:normal; font-weight:700; padding:0 12px; }
  #flash { position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; }
  #vig { position:fixed; inset:0; pointer-events:none; opacity:0;
    background:radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(10,8,16,.55) 100%); }
  .blink { animation:blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity:.25; } }
  #stage { left:50%; top:46%; transform:translateX(-50%); font-size:clamp(13px,2vw,20px); letter-spacing:.16em; opacity:0; transition:opacity .3s; white-space:nowrap; }
  #menu { margin-top:20px; pointer-events:auto; display:flex; flex-direction:column; gap:9px; align-items:center; padding:0 10px; }
  #menu .row { display:flex; gap:7px; flex-wrap:wrap; justify-content:center; align-items:center; }
  #menu .lbl { font-size:12px; letter-spacing:.2em; min-width:96px; text-align:right; text-shadow:2px 2px 0 var(--ink); }
  #menu button { font:inherit; font-style:italic; text-transform:uppercase; font-size:clamp(11px,1.5vw,15px); padding:7px 13px; cursor:pointer;
    border:3px solid var(--ink); background:rgba(27,23,36,.6); color:var(--cream); box-shadow:3px 3px 0 var(--ink); }
  #menu button:hover { background:rgba(27,23,36,.85); }
  #menu button.on { background:var(--hot); color:var(--ink); }
  #overlay { z-index:2; } .hud { z-index:3; }
  .scr { margin-top:24px; pointer-events:auto; display:flex; flex-direction:column; gap:12px; align-items:center; padding:0 10px; }
  .scr .row { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; align-items:center; }
  .scr button, #navUI button { font:inherit; font-style:italic; text-transform:uppercase; cursor:pointer; border:3px solid var(--ink);
    background:rgba(27,23,36,.6); color:var(--cream); box-shadow:3px 3px 0 var(--ink); font-size:clamp(13px,1.8vw,18px); padding:9px 18px; }
  .scr button:hover, #navUI button:hover { background:rgba(27,23,36,.85); }
  .scr button.big { font-size:clamp(20px,3.4vw,34px); padding:14px 30px; background:var(--hot); color:var(--ink); }
  #codeIn { font:inherit; font-size:24px; width:150px; text-align:center; text-transform:uppercase; letter-spacing:.2em; padding:8px;
    border:3px solid var(--ink); background:var(--cream); color:var(--ink); box-shadow:3px 3px 0 var(--ink); outline:none; }
  .netmsg { font-size:clamp(12px,1.8vw,16px); letter-spacing:.1em; text-shadow:2px 2px 0 var(--ink); min-height:1.2em; line-height:1.6; }
  .netmsg b { color:var(--hot); font-size:1.6em; letter-spacing:.25em; }
  .slot { min-width:150px; padding:12px 16px; border:3px solid var(--ink); background:rgba(27,23,36,.6); box-shadow:3px 3px 0 var(--ink); }
  .slot .who { font-size:26px; color:var(--hot); } .slot .lbl2 { font-size:12px; letter-spacing:.2em; }
  #nav { position:fixed; inset:0; width:100%; height:100%; z-index:1; }
  #navUI { position:fixed; left:0; right:0; bottom:14px; display:flex; justify-content:center; gap:8px; flex-wrap:wrap; z-index:3; padding:0 8px; }
  #navUI button { font-size:clamp(12px,1.7vw,17px); padding:12px 14px; }
  #call { left:50%; top:22%; transform:translate(-50%,-50%) rotate(-3deg); font-size:clamp(36px,8vw,92px); color:var(--hot); opacity:0; transition:opacity .15s; white-space:nowrap; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div>
<div id="flash"></div>
<div id="score" class="hud hidden">0<small>metres</small></div>
<div id="speed" class="hud hidden">0<small>km/h</small></div>
<div id="drift" class="hud"></div>
<div id="count" class="hud"></div>
<div id="stage" class="hud"></div>
<div id="call" class="hud"></div>
<canvas id="nav" class="hidden"></canvas>
<div id="navUI" class="hidden"><button tabindex="-1" data-call="hl">◀◀ hard left · Q</button><button tabindex="-1" data-call="l">◀ left · A</button><button tabindex="-1" data-call="flat">▲ flat out · W</button><button tabindex="-1" data-call="care">! careful · S</button><button tabindex="-1" data-call="r">right ▶ · D</button><button tabindex="-1" data-call="hr">hard right ▶▶ · E</button></div>
<div id="overlay">
  <div id="title">BLIND<span>CORNER</span></div>
  <div id="sub" class="blink">press <b>space</b> to drive</div>
  <div id="hint">← → steer · hold SPACE to drift · no brakes · 1 2 3 difficulty · W weather · M mute</div>
  <div id="scrMode" class="scr"><div class="row"><button tabindex="-1" class="big" data-act="1p">1 player</button><button tabindex="-1" class="big" data-act="2p">2 players</button></div></div>
  <div id="scrOnline" class="scr hidden">
    <div class="row"><button tabindex="-1" class="big" data-act="host">host a game</button></div>
    <div class="row"><input id="codeIn" maxlength="6" placeholder="CODE" autocomplete="off" spellcheck="false"><button tabindex="-1" data-act="join">join</button></div>
    <div id="netMsg" class="netmsg"></div>
    <div class="row"><button tabindex="-1" data-act="back">back</button></div>
  </div>
  <div id="scrRoles" class="scr hidden">
    <div class="netmsg">connected · code <b id="codeShow"></b></div>
    <div class="row"><div class="slot"><div class="lbl2">driver</div><div class="who" id="drvWho"></div></div><div class="slot"><div class="lbl2">navigator — has the map</div><div class="who" id="navWho"></div></div></div>
    <div class="row"><button tabindex="-1" data-act="swap">swap roles</button><button tabindex="-1" class="big" data-act="next">next</button></div>
  </div>
  <div id="menu" class="hidden">
    <div class="row"><span class="lbl">difficulty</span><button tabindex="-1" data-d="easy">easy</button><button tabindex="-1" data-d="medium">medium</button><button tabindex="-1" data-d="hard">hard</button></div>
    <div class="row"><span class="lbl">car</span><button tabindex="-1" data-c="black">black</button><button tabindex="-1" data-c="red">red</button><button tabindex="-1" data-c="yellow">yellow</button><button tabindex="-1" data-c="white">white</button><button tabindex="-1" data-c="blue">blue</button></div>
    <div class="row"><span class="lbl">weather</span><button tabindex="-1" data-w="random">random</button><button tabindex="-1" data-w="sunny">sunny</button><button tabindex="-1" data-w="cloudy">cloudy</button><button tabindex="-1" data-w="rain">rain</button><button tabindex="-1" data-w="storm">storm</button><button tabindex="-1" data-w="snow">snow</button></div>
    <div class="row"><button tabindex="-1" data-act="toMode">change players</button></div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const elScore=$('score'), elSpeed=$('speed'), elDrift=$('drift'), elCount=$('count'), elOverlay=$('overlay'),
      elTitle=$('title'), elSub=$('sub'), elHint=$('hint'), elFlash=$('flash'), elVig=$('vig'), elMenu=$('menu'), elStage=$('stage');
if (!window.THREE){ elSub.textContent='could not load the 3D library — check your internet'; return; }

const DS=3.0, MAXH=1.5, STEP=1/120, BACK=24, AHEAD=118, NPTS=BACK+AHEAD+1;
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const wrap=a=>{ while(a>Math.PI)a-=2*Math.PI; while(a<-Math.PI)a+=2*Math.PI; return a; };

/* ===== smooth value noise: hills + colour variation ===== */
const NV=new Float32Array(1024);
function reseedNoise(){ for(let i=0;i<1024;i++) NV[i]=Math.random(); }
reseedNoise();
const fade=t=>t*t*t*(t*(t*6-15)+10);
const nh=(a,b)=>NV[((a*73856093)^(b*19349663))&1023];
function vn(x,z){ const xi=Math.floor(x), zi=Math.floor(z), xf=fade(x-xi), zf=fade(z-zi);
  const a=nh(xi,zi), b=nh(xi+1,zi), c=nh(xi,zi+1), d=nh(xi+1,zi+1), ab=a+(b-a)*xf; return ab+((c+(d-c)*xf)-ab)*zf; }
const HILL=window.__HILL={a:24,sa:260,b:3.5,sb:120,g:26,air:0.9,airGrip:3};
const hillH=(x,z)=>HILL.a*(vn(x/HILL.sa,z/HILL.sa)-0.5)*2+HILL.b*(vn(x/HILL.sb+40,z/HILL.sb+40)-0.5)*2;

/* ===== car tuning ===== */
const GTOP=[17,29,41,53,65,78];               // top speed of each gear (m/s)
const GACC=[20,15,12,9.5,8,7];                // engine push per gear (m/s²)
const T=window.__T={yawG:1.75,yawD:2.7,rMin:45,rMax:92,look:6,grip:8.5,steerRate:5,hiCut:0.15};
const torque=r=>0.72+0.38*Math.sin(Math.PI*clamp(r,0,1)*0.9+0.15);

/* ===== difficulty + weather ===== */
const DIFFS={ easy:  {vmin:39,vmax:50,rocksOff:0.05,roadRocks:0},     // 140 → 180 km/h, few roadside rocks
              medium:{vmin:45,vmax:61,rocksOff:0.14,roadRocks:0},     // 162 → 220 km/h
              hard:  {vmin:50,vmax:74,rocksOff:0.3,roadRocks:0} };    // 180 → 266 km/h, rocks all along the verge
const WEATHERS={
  sunny: {top:0x24395a,hor:0xc9927a,fog:0x6f7f8a,near:90,far:345,hemi:[0xc9d3e6,0x2f3a28,0.5],sun:[0xffb880,0.45],mtn:[0x5d6878,0x3f5049],grip:1,wind:0,wipers:0,precip:null},
  cloudy:{top:0x3d4650,hor:0x79828a,fog:0x6c747b,near:70,far:270,hemi:[0xb9c0c8,0x2c3428,0.52],sun:[0xdde4ea,0.14],mtn:[0x58616b,0x3e4a45],grip:1,wind:0.12,wipers:0,precip:null},
  rain:  {top:0x2c333b,hor:0x58606a,fog:0x525a62,near:35,far:190,hemi:[0xa9b3bf,0x262e24,0.44],sun:[0xc9d3dc,0.06],mtn:[0x48515a,0x343f3b],grip:0.74,wind:0.2,wipers:1.1,precip:'rain',amount:1,lamps:true,wet:true},
  storm: {top:0x15191f,hor:0x343a42,fog:0x30363d,near:25,far:150,hemi:[0x95a0ad,0x1d241c,0.34],sun:[0xc0c8d0,0.03],mtn:[0x30373e,0x252d29],grip:0.64,wind:1,wipers:0.75,precip:'rain',amount:1.7,lamps:true,wet:true,lightning:true},
  snow:  {top:0x7e8a97,hor:0xc3cbd3,fog:0xb3bcc5,near:30,far:175,hemi:[0xe9eef6,0x8a919a,0.72],sun:[0xf2f5fa,0.18],mtn:[0xa4adb7,0x8a949b],grip:0.52,wind:0.3,wipers:0,precip:'snow',amount:1,lamps:true,snow:true} };
const WNAMES=['sunny','cloudy','rain','storm','snow'];
let settings={diff:'medium',weather:'random',color:'black'};
const CARCOL={black:0x1c1c22,red:0xc8322a,yellow:0xffd23f,white:0xe6e6e1,blue:0x2856a8};
try{ Object.assign(settings,JSON.parse(localStorage.getItem('fullsend3d.settings')||'{}')); }catch(e){}
if(!DIFFS[settings.diff]) settings.diff='medium'; if(settings.weather!=='random'&&!WEATHERS[settings.weather]) settings.weather='random';
let D=DIFFS[settings.diff], WX=WEATHERS.sunny, wxName='sunny', lastRockAbs=-999, stageName='';
const TR={rMul:1,sMul:1};
const ROADS={ asphalt:{h:0.6,s:0.04,l:0.27,line:true,sh:[0.1,0.06,0.47],rut:[0.6,0.04,0.21],grip:1},
              gravel: {h:0.09,s:0.1,l:0.47,line:false,sh:[0.1,0.1,0.56],rut:[0.08,0.12,0.36],grip:0.88},
              dirt:   {h:0.07,s:0.3,l:0.34,line:false,sh:[0.2,0.22,0.3],rut:[0.06,0.3,0.24],grip:0.84} };
const RD={h:0,s:0,l:0,line:true,sh:[0,0,0],rut:[0,0,0],grip:1}, RDc={...RD,sh:[0,0,0],rut:[0,0,0]};
// surface drifts asphalt → gravel → dirt and back along the road, blending at the changeovers
function roadAt(i,o){ const t=vn(i*0.0045,5.5); let A,B,k;
  if(t<0.5){ A=ROADS.asphalt; B=ROADS.gravel; k=fade(clamp((t-0.38)/0.08,0,1)); } else { A=ROADS.gravel; B=ROADS.dirt; k=fade(clamp((t-0.6)/0.08,0,1)); }
  const L=(a,b)=>a+(b-a)*k; o.h=L(A.h,B.h); o.s=L(A.s,B.s); o.l=L(A.l,B.l); o.grip=L(A.grip,B.grip); o.line=k<0.5?A.line:B.line;
  for(let q=0;q<3;q++){ o.sh[q]=L(A.sh[q],B.sh[q]); o.rut[q]=L(A.rut[q],B.rut[q]); } return o; }
const loadBest=()=>{ try{ return +localStorage.getItem('fullsend3d.best.'+settings.diff)||0; }catch(e){ return 0; } };

/* ================= three.js scene ================= */
const SKY=0x6f7f8a;
const renderer=new THREE.WebGLRenderer({canvas:$('c'),antialias:true});
const scene=new THREE.Scene(); scene.background=new THREE.Color(SKY); scene.fog=new THREE.Fog(SKY,90,345);
const camera=new THREE.PerspectiveCamera(70,1,0.05,600); camera.rotation.order='YXZ';
const rig=new THREE.Group(); rig.rotation.order='YXZ'; scene.add(rig); rig.add(camera);
const hemi=new THREE.HemisphereLight(0xc9d3e6,0x2f3a28,0.5); scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffb880,0.45); sun.position.set(0.5,1,0.35); scene.add(sun);
const lam=(c,o)=>new THREE.MeshLambertMaterial(Object.assign({color:c,flatShading:true},o||{}));

/* sky dome + mountains (follow the car) */
const skyG=new THREE.SphereGeometry(500,24,12), skyC=[], cTop=new THREE.Color(0x24395a), cHor=new THREE.Color(0xc9927a);
for(let i=0;i<skyG.attributes.position.count;i++){ const y=skyG.attributes.position.getY(i)/500; const c=cHor.clone().lerp(cTop,clamp(y*1.6,0,1)); skyC.push(c.r,c.g,c.b); }
skyG.setAttribute('color',new THREE.Float32BufferAttribute(skyC,3));
const sky=new THREE.Mesh(skyG,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.BackSide,fog:false,depthWrite:false}));
sky.renderOrder=-2; scene.add(sky);
function mountainRing(R,hmin,hmax,col,seg){
  const pos=[]; let prev=null;
  for(let i=0;i<=seg;i++){ const a=i/seg*Math.PI*2, h=i===seg?first:rand(hmin,hmax); if(i===0) var first=h;
    const p={x:Math.cos(a)*R,z:Math.sin(a)*R,h};
    if(prev){ pos.push(prev.x,-10,prev.z, p.x,-10,p.z, prev.x,prev.h,prev.z, p.x,-10,p.z, p.x,p.h,p.z, prev.x,prev.h,prev.z); }
    prev=p; }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  const m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:col,fog:false,side:THREE.DoubleSide,depthWrite:false})); m.renderOrder=-1; scene.add(m); return m;
}
const mtnFar=mountainRing(470,30,95,0x5d6878,64), mtnNear=mountainRing(440,12,48,0x3f5049,90);

const TG=120, TS=5, nearIdx=new Int32Array((TG+1)*(TG+1)), nearD=new Float32Array((TG+1)*(TG+1));
const terrGeo=new THREE.PlaneGeometry(TG*TS,TG*TS,TG,TG); terrGeo.rotateX(-Math.PI/2);
terrGeo.setAttribute('color',new THREE.BufferAttribute(new Float32Array(terrGeo.attributes.position.count*3),3));
const terrain=new THREE.Mesh(terrGeo,new THREE.MeshLambertMaterial({vertexColors:true,flatShading:true})); terrain.frustumCulled=false; scene.add(terrain);

function ribbonGeo(){ const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(NPTS*6),3));
  const n=new Float32Array(NPTS*6); for(let i=1;i<n.length;i+=3)n[i]=1; g.setAttribute('normal',new THREE.BufferAttribute(n,3));
  g.setAttribute('color',new THREE.BufferAttribute(new Float32Array(NPTS*6).fill(1),3));
  const idx=[]; for(let i=0;i<NPTS-1;i++){ const a=i*2; idx.push(a,a+1,a+2,a+1,a+3,a+2); } g.setIndex(idx); return g; }
const roadM=new THREE.Mesh(ribbonGeo(),lam(0xffffff,{side:THREE.DoubleSide,vertexColors:true}));
const shoulderM=new THREE.Mesh(ribbonGeo(),lam(0xffffff,{side:THREE.DoubleSide,vertexColors:true}));
const rutL=new THREE.Mesh(ribbonGeo(),lam(0x86705a,{side:THREE.DoubleSide}));
const rutR=new THREE.Mesh(ribbonGeo(),lam(0x86705a,{side:THREE.DoubleSide}));
const lineM=new THREE.Mesh(ribbonGeo(),lam(0xffffff,{side:THREE.DoubleSide,vertexColors:true}));
for(const m of [roadM,shoulderM,rutL,rutR,lineM]){ m.frustumCulled=false; scene.add(m); }

const MAXT=4000, treeMat=lam(0xffffff);
function mergeGeos(list){ const parts=list.map(g=>g.index?g.toNonIndexed():g); let n=0; for(const g of parts) n+=g.attributes.position.count;
  const pos=new Float32Array(n*3); let o=0; for(const g of parts){ pos.set(g.attributes.position.array,o); o+=g.attributes.position.array.length; }
  const out=new THREE.BufferGeometry(); out.setAttribute('position',new THREE.BufferAttribute(pos,3)); out.computeVertexNormals(); return out; }
const geoAt=(g,x,y,z,sx,sy,sz)=>{ g.scale(sx||1,sy||1,sz||1); g.translate(x,y,z); return g; };
// tall spruce (4 tiers), round oak (blob cluster), poplar (tall column), plus pine + birch below
const gSpruce=mergeGeos([geoAt(new THREE.ConeGeometry(2.7,5.2,7),0,4.8,0),geoAt(new THREE.ConeGeometry(2.1,4.6,7),0,7.9,0),
  geoAt(new THREE.ConeGeometry(1.4,3.8,7),0,10.6,0),geoAt(new THREE.ConeGeometry(0.75,2.6,6),0,12.8,0)]);
const gOak=mergeGeos([geoAt(new THREE.IcosahedronGeometry(2.6,0),0,5.4,0),geoAt(new THREE.IcosahedronGeometry(2.0,0),1.7,4.6,0.6),
  geoAt(new THREE.IcosahedronGeometry(2.1,0),-1.4,4.8,-0.9),geoAt(new THREE.IcosahedronGeometry(1.8,0),0.2,6.9,-0.4)]);
const gPoplar=geoAt(new THREE.IcosahedronGeometry(1,1),0,7.2,0,1.5,4.6,1.5);
const gTrunk=new THREE.CylinderGeometry(0.22,0.34,2.4,5); gTrunk.translate(0,1.2,0);
const gConeA=new THREE.ConeGeometry(2.3,4.2,6); gConeA.translate(0,3.6,0);
const gConeB=new THREE.ConeGeometry(1.6,3.4,6); gConeB.translate(0,5.9,0);
const gBall=new THREE.IcosahedronGeometry(2.3,0); gBall.translate(0,3.9,0);
const gRock=new THREE.DodecahedronGeometry(0.7,0); gRock.translate(0,0.25,0);
const gShadow=new THREE.CircleGeometry(2.2,9); gShadow.rotateX(-Math.PI/2); gShadow.translate(0.5,0.03,0.4);
const gBush=new THREE.IcosahedronGeometry(0.9,0); gBush.translate(0,0.55,0);
const gFlower=new THREE.OctahedronGeometry(0.17,0); gFlower.translate(0,0.28,0);

function genStep(){
  const d=diff(metresAt(pts.length));
  if(g.left<=0){
    if(g.mode==='turn'){ g.mode='straight'; g.left=rand(30,150)*(1-0.4*d)*(0.45+1.1*vn((trimmed+pts.length)*0.0035,6.6)); }
    else { g.mode='turn'; let t; do{ t=rand(-MAXH,MAXH); }while(Math.abs(t-g.h)<0.7);
      g.sign=Math.sign(t-g.h); g.r=rand(T.rMin,T.rMax-18*d)*(0.88+0.4*vn((trimmed+pts.length)*0.003,2.2)); g.left=Math.abs(t-g.h)*g.r; }
  }
  if(g.mode==='turn') g.h+=g.sign*DS/g.r;
  g.x+=Math.sin(g.h)*DS; g.y-=Math.cos(g.h)*DS; g.left-=DS;
  pts.push({x:g.x,y:g.y,h:g.h,e:hillH(g.x,g.y),w:Math.max(2.5,2.7+1.2*vn((trimmed+pts.length)*0.006,8.1)-0.45*d),trees:null});
  // new road can swing back past trees planted from a much earlier stretch: clear any whose crown would reach it
  const np=pts[pts.length-1], hiI=pts.length-81;
  for(let i=Math.max(0,pts.length-420);i<hiI;i++){ const tr=pts[i].trees; if(!tr) continue;
    for(let k=tr.length-1;k>=0;k--){ const t=tr[k], dx=t.x-np.x, dy=t.y-np.y, cr={0:2.3,1:3.9,5:1.7,7:2.7,8:1.6}[t.kind]||1;
      const need=np.w+1.6+cr*t.s; if(dx*dx+dy*dy<need*need){ tr.splice(k,1); if(car&&i>=car.idx-BACK) treesDirty=true; } } }
}
// road lookup: distance to the road and its height there (coarse search, then refine)
function roadInfo(x,y,a,b){
  let bd=1e18, bi=a;
  for(let j=a;j<=b;j+=3){ const dx=pts[j].x-x, dy=pts[j].y-y, d=dx*dx+dy*dy; if(d<bd){bd=d;bi=j;} }
  for(let j=Math.max(a,bi-3);j<=Math.min(b,bi+3);j++){ const dx=pts[j].x-x, dy=pts[j].y-y, d=dx*dx+dy*dy; if(d<bd){bd=d;bi=j;} }
  let best=bd, e=pts[bi].e;
  for(let i=Math.max(a,bi-1); i<Math.min(b,bi+1); i++){ const p=pts[i], q=pts[i+1], ex=q.x-p.x, ey=q.y-p.y;
    const t=clamp(((x-p.x)*ex+(y-p.y)*ey)/(ex*ex+ey*ey),0,1), dx=x-(p.x+ex*t), dy=y-(p.y+ey*t), d=dx*dx+dy*dy;
    if(d<=best){ best=d; e=hillH(p.x+ex*t,p.y+ey*t); } }
  return {d:Math.sqrt(best), e, w:pts[bi].w};
}
// ground height: natural hills, flattened into a bench where the road cuts through
function groundH(x,y,a,b,forCar){ const r=roadInfo(x,y,a,b);
  if(forCar&&r.d<r.w+2.4) return r.e+0.04-0.24*fade(clamp((r.d-r.w-0.6)/1.8,0,1));   // smooth edge, no ledge to launch off
  const k=fade(clamp((r.d-(r.w+5))/20,0,1)); return (r.e-0.2)*(1-k)+hillH(x,y)*k; }
function grassCol(x,z,h,c){ const n=vn(x/55+11,z/55+7), n2=vn(x/16,z/16), dry=vn(x/150+3,z/150+9);
  if(WX.snow){ if(dry>0.74) c.setHSL(0.2,0.12,0.4+0.1*n); else c.setHSL(0.6,0.08+0.06*n2,0.78+0.1*n); return; }
  c.setHSL(0.27-0.08*dry+0.03*(n-0.5), 0.4+0.16*n2, 0.2+0.07*n+clamp(h/90,-0.05,0.05)-(WX.wet?0.03:0)); }

function makeTrees(i){
  const p=pts[i], out=[], px=Math.cos(p.h), py=Math.sin(p.h), fx=Math.sin(p.h), fy=-Math.cos(p.h);
  const a=Math.max(0,i-80), b=Math.min(pts.length-1,i+80);
  const tryAdd=(off,kind,along)=>{ const al=along||0, x=p.x+px*off+fx*al+rand(-1,1), y=p.y+py*off+fy*al+rand(-1,1);
    const sc=kind===4?rand(0.7,1.3):kind===3?rand(0.6,1.4):kind===2?rand(0.7,1.6):kind===7?rand(0.85,1.6):kind===8?rand(0.85,1.35):rand(0.85,1.6);
    // keep the whole crown off the road: trunk distance must exceed road half-width + verge + this tree's canopy radius
    const crown={0:2.3,1:3.9,5:1.7,7:2.7,8:1.6}[kind];
    const need=kind===4?p.w+1.2:kind===3?p.w+2.2:kind===2?p.w+1.4:p.w+1.6+crown*sc;
    for(let j=Math.max(0,i-300),J=pts.length;j<J;j++){ const dx=pts[j].x-x, dy=pts[j].y-y; if(dx*dx+dy*dy<need*need) return; }   // check all road that exists, not just nearby
    out.push({x,y,e:groundH(x,y,a,b),s:sc,
      r:rand(0,6.28),kind,c:Math.random(),au:vn(x/320+21,y/320+3)}); };
  // forest type drifts along the stage: conifer woods → mixed → broadleaf; density has thick stands and clearings
  const zone=vn(p.x/260+7,p.y/260+2), dens=0.55+0.6*vn(p.x/180+3,p.y/180+11);
  const tk=()=>{ const r=Math.random();
    if(zone<0.4) return r<0.45?7:r<0.85?0:5;                              // spruce / pine / birch
    if(zone<0.62) return r<0.3?1:r<0.55?0:r<0.7?7:r<0.85?5:8;             // mixed
    return r<0.45?1:r<0.65?8:r<0.85?5:0; };                                // oak / poplar / birch / pine
  const ROWS=[[7.2,11,0.6],[11,18,0.9],[18,28,0.95],[28,42,0.9],[42,60,0.85],[60,85,0.8],[85,120,0.7],[120,160,0.45]];
  for(const s of [-1,1]){
    for(const [a0,a1,pr] of ROWS) if(Math.random()<pr*dens) tryAdd(s*rand(a0,a1),tk());
    if(Math.random()<D.rocksOff) tryAdd(s*rand(p.w+1.6,p.w+4.5),2);
    if(Math.random()<0.3) tryAdd(s*rand(6.5,14),3);
    if(Math.random()<0.3){ const o=s*rand(5.2,9), n=3+(Math.random()*4|0); for(let f=0;f<n;f++) tryAdd(o+rand(-1.2,1.2),4,rand(-1.5,1.5)); }
  }
  const abs=trimmed+i;                                     // rocks ON the road (medium / hard)
  if(D.roadRocks>0&&abs*DS>300&&abs-lastRockAbs>12&&Math.random()<D.roadRocks*(1+diff(abs*DS))){ lastRockAbs=abs;
    const off=rand(-(p.w-0.7),p.w-0.7); out.push({x:p.x+px*off,y:p.y+py*off,e:p.e+0.02,s:rand(0.8,1.25),r:rand(0,6.28),kind:6,c:Math.random(),au:0,off}); }
  p.trees=out;
}
function ensureWorld(){

  for(let i=0;i<=upTo;i++) if(!pts[i].trees) makeTrees(i);

const netMsg=t=>{ elNetMsg.innerHTML=t; };
const send=o=>{ if(NET.conn&&NET.ready) try{ NET.conn.send(o); }catch(e){} };
function loadPeer(){ return new Promise((res,rej)=>{ if(window.Peer) return res();
  const add=(src,next)=>{ const s=document.createElement('script'); s.src=src; s.onload=()=>res(); s.onerror=next; document.head.appendChild(s); };
  add('https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js',()=>add('https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js',()=>rej(new Error('load')))); }); }
const genCode=()=>{ const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s=''; for(let i=0;i<5;i++) s+=A[Math.random()*A.length|0]; return s; };
function netReset(){ try{ NET.conn&&NET.conn.close(); }catch(e){} try{ NET.peer&&NET.peer.destroy(); }catch(e){}
  Object.assign(NET,{peer:null,conn:null,ready:false,navActive:false,navDead:false,st:null,navPts:[]}); elNav.classList.add('hidden'); elNavUI.classList.add('hidden'); }
async function hostGame(){
  netReset(); NET.isHost=true; netMsg('setting up…');
  try{ await loadPeer(); }catch(e){ netMsg('could not load the online library — check your internet'); return; }
  const code=genCode(); NET.code=code; const peer=new Peer('fullsend-'+code.toLowerCase()); NET.peer=peer;
  peer.on('open',()=>netMsg('your code: <b>'+code+'</b><br>tell your friend to press join and type it in'));
  peer.on('error',e=>{ if(e.type==='unavailable-id'){ hostGame(); } else netMsg('connection problem ('+e.type+') — try again'); });
  peer.on('connection',c=>{ if(NET.conn){ c.close(); return; } setupConn(c); }); }
async function joinGame(){

  netReset(); NET.isHost=false; NET.code=code; netMsg('joining '+code+'…');
  try{ await loadPeer(); }catch(e){ netMsg('could not load the online library — check your internet'); return; }

function setupConn(c){ NET.conn=c;

  c.on('data',onNet); c.on('close',netLost); c.on('error',netLost); }
function netLost(){ if(NET.mode!==2) return; NET.mode=1; const wasNav=NET.navActive; netReset();
  if(state!=='title'){ state='title'; bot=true; reset(); elScore.classList.add('hidden'); elSpeed.classList.add('hidden'); }

function onNet(d){ if(!d||!d.t) return;
  switch(d.t){
    case 'roles': NET.hostRole=d.hostRole; updateRoles(); if(scr==='custom') showScreen('custom'); break;
    case 'screen': showScreen(d.s); break;
    case 'set': NET.applying=true; if(d.diff!==settings.diff) setDiff(d.diff); if(d.color!==settings.color) setColor(d.color); if(d.weather!==settings.weather) setWeatherPick(d.weather); NET.applying=false; break;
    case 'reqStart': if(myRole()==='driver'&&scr==='custom'&&(state==='title'||(state==='dead'&&tDead>0.6))){ start(); netAfterStart(); } break;
    case 'call': if(myRole()==='driver') showCall(d.k); break;
    // ---- navigator side ----
    case 'start': NET.navActive=true; NET.navDead=false; NET.navPts=[]; NET.st=null; NET.wx=d.wx; NET.stage=d.stage;
      elOverlay.classList.add('hidden'); elNav.classList.remove('hidden'); elNavUI.classList.remove('hidden'); navResize(); break;
    case 'pts': for(let k=0;k*3<d.d.length;k++) NET.navPts[d.from+k]=[d.d[k*3],d.d[k*3+1],d.d[k*3+2]]; break;

function start(){

  elStage.innerHTML=stageName+' &nbsp;·&nbsp; '+wxName+' &nbsp;·&nbsp; '+settings.diff; elStage.style.opacity=1; countT=2.7; lastCount=''; bot=false; audioInit();

function botInputs(){
  const look=3+Math.floor(car.speed/T.look);
  let off=0, li=look; scan: for(let i=car.idx-1;i<Math.min(pts.length,car.idx+34);i++){ const tr=pts[i].trees; if(!tr) continue;
    for(const t of tr) if(t.kind===6){ off=clamp(t.off>0?t.off-2.1:t.off+2.1,-(pts[i].w-0.6),pts[i].w-0.6); li=clamp(i-car.idx+2,3,look); break scan; } }
  const p0=pts[Math.min(pts.length-1,car.idx+li)], p={x:p0.x+Math.cos(p0.h)*off,y:p0.y+Math.sin(p0.h)*off};
  const want=Math.atan2(p.x-car.x,-(p.y-car.y));
  const vh=car.speed>3?Math.atan2(car.vx,-car.vy):car.h;
  const err=wrap(want-(car.h*0.55+vh*0.45)), slide=wrap(want-vh);
  return { s:clamp(err*3.5,-1,1), d:Math.abs(slide)>0.5&&car.speed>22 };
}

/* ================= physics ================= */
function nearest(){
  let bi=car.idx, bd=1e18; const a=Math.max(0,car.idx-6), b=Math.min(pts.length-1,car.idx+40);
  for(let i=a;i<=b;i++){ const dx=pts[i].x-car.x, dy=pts[i].y-car.y, d=dx*dx+dy*dy; if(d<bd){bd=d;bi=i;} }
  car.idx=bi; let best2=1e18;
  for(let i=Math.max(0,bi-1); i<Math.min(pts.length-1,bi+1); i++){
    const p=pts[i], q=pts[i+1], ex=q.x-p.x, ey=q.y-p.y;
    const t=clamp(((car.x-p.x)*ex+(car.y-p.y)*ey)/(ex*ex+ey*ey),0,1);
    const dx=car.x-(p.x+ex*t), dy=car.y-(p.y+ey*t); best2=Math.min(best2,dx*dx+dy*dy); }
  return Math.sqrt(best2);
}
const spring=(s,t,k,c,dt)=>{ s.v+=(k*(t-s.x)-c*s.v)*dt; s.x+=s.v*dt; };
function springs(dt){
  const H=head;
  spring(H.z,clamp(car.al*0.0095,-0.06,0.2),55,8,dt);       // pushed back when accelerating
  spring(H.x,clamp(-car.at*0.0035,-0.08,0.08),50,8,dt);     // thrown outward in corners
  spring(H.p,clamp(car.al*0.0022,-0.04,0.04),80,9,dt);      // nose lifts / dives
  spring(H.r,clamp(car.at*0.0032,-0.08,0.08),70,9,dt);      // body roll
  spring(H.y,0,220,13,dt);                                  // suspension
}
function step(dt){

  const pvx=car.vx, pvy=car.vy;
  car.steer+=(inp.s-car.steer)*Math.min(1,dt*(bot?12:T.steerRate));   // players get a smooth wheel; the test bot steers instantly
  car.drifting=inp.d;
  const yaw=car.steer*(inp.d?T.yawD:T.yawG)*Math.min(1,car.speed/6)*(1-T.hiCut*clamp((car.speed-20)/50,0,1))*(car.air?HILL.air:1)*(0.75+0.25*WX.grip*car.surf);
  car.h+=yaw*dt; car.yaw=yaw;
  const fx=Math.sin(car.h), fy=-Math.cos(car.h), rx=-fy, ry=fx;
  let vf=car.vx*fx+car.vy*fy, vl=car.vx*rx+car.vy*ry;

  // gearbox + engine
  const rpmRaw=Math.max(0,vf)/GTOP[car.gear];
  if(car.shiftT<=0){
    if(rpmRaw>0.97&&car.gear<5){ startShift(car.gear,car.gear+1); car.gear++; car.shiftT=0.22; head.p.v-=0.25; shiftSfx(); }
    else if(car.gear>0&&Math.max(0,vf)/GTOP[car.gear-1]<0.78){ startShift(car.gear,car.gear-1); car.gear--; car.shiftT=0.1; }

  { const a=Math.max(0,car.idx-24), b=Math.min(pts.length-1,car.idx+24);

}

    const g3=ac.createGain(); g3.gain.value=0.5; eng3.connect(g3); g3.connect(engLp);

/* ================= loop ================= */
let last=performance.now(), acc=0, bob=0, frameNo=0, frameEma=1/60, lastPrCheck=0;
function frame(now){
  const dt=Math.max(0,Math.min(0.05,(now-last)/1000)); last=Math.max(last,now);
  if(NET.navActive){ drawNav(dt); requestAnimationFrame(frame); return; }     // navigator: map screen only
  netTick(now); if(callT>0){ callT-=dt; if(callT<=0) elCall.style.opacity=0; }
  if(state==='play'||state==='title'){ acc+=dt; while(acc>=STEP&&(state==='play'||state==='title')){ step(STEP); acc-=STEP; } }
  else { acc=0; time+=dt; springs(Math.min(dt,1/60)); }
  if(state==='dead') tDead+=dt;
  if(state==='count'){
    countT-=dt; const n=countT>0.9?String(Math.ceil((countT-0.9)/0.6)):'GO!';
    if(n!==lastCount){ lastCount=n; elCount.textContent=n; elCount.style.opacity=1; beep(n==='GO!'?880:440,n==='GO!'?0.4:0.15); }
    head.y.v+=rand(-1,1)*0.02;   // idle shake
    if(countT<=0.9){ state='play'; }
  } else if(state==='play'&&lastCount==='GO!'){ countT-=dt; if(countT<0.2){ elCount.style.opacity=0; elStage.style.opacity=0; lastCount='done'; } }
  if(Math.abs(trimmed+car.idx-builtAt)>=12||treesDirty){ treesDirty=false; buildWindow(); }

  // car rig + head
  const sp=car.speed;
  shake=shake>0.005?shake*Math.exp(-5*dt):0;
  rig.position.set(car.x,car.z,car.y);
  const roll=head.r.x+(state==='dead'?crashRoll*Math.min(1,tDead*6):0);
  rig.rotation.set(car.pitch+head.p.x,-car.h,roll);
  const sh=shake*0.12; bob+=dt*sp*0.6;
  camera.position.set(DRV+head.x.x+rand(-sh,sh),1.15+EYE+head.y.x+Math.sin(bob)*0.004+rand(-sh,sh),head.z.x);
  if(performance.now()-look.t>1400){ look.ty=0; look.tp=0; }
  look.y+=(look.ty-look.y)*Math.min(1,dt*6); look.p+=(look.tp-look.p)*Math.min(1,dt*6);
  camera.rotation.set(-0.1-head.y.x*0.3+look.p,-head.x.x*0.15+look.y,0);
  hoodGrp.position.y=Math.sin(time*70)*0.0025*Math.min(1,sp/30);
  const fov=Math.min(94,75+19*clamp(sp/72,0,1)+clamp(car.al,-10,20)*0.2);

  let reach=0, lx, lz;
  if(state==='count'){ const n=slotOf(-1); lx=n.x; lz=n.z; if(countT<1.2&&gearAnim.t>=1&&gearAnim.to!==0) startShift(-1,0); }
  if(gearAnim.t<1){ gearAnim.t=Math.min(1,gearAnim.t+dt/gearAnim.dur); const u=gearAnim.t, A0=slotOf(gearAnim.from), B=slotOf(gearAnim.to);
    reach=u<0.25?fade(u/0.25):u<0.75?1:fade((1-u)/0.25);
    if(u<0.25){ lx=A0.x; lz=A0.z; }
    else if(u<0.42){ const k=fade((u-0.25)/0.17); lx=A0.x; lz=A0.z*(1-k); }
    else if(u<0.58){ const k=fade((u-0.42)/0.16); lx=A0.x+(B.x-A0.x)*k; lz=0; }
    else if(u<0.75){ const k=fade((u-0.58)/0.17); lx=B.x; lz=B.z*k; }
    else { lx=B.x; lz=B.z; } }
  else if(state!=='count'){ const c=slotOf(car.gear); lx=c.x; lz=c.z; }

  else if(state==='play'){ gasT=(car.shiftT>0||reach>0.35)?0:1; cluT=reach; }

  for(let i=0;i<NS;i++){ const s=streaks[i]; s.z+=sp*dt*1.15; if(s.z>2) spawnStreak(s,rand(-90,-60));
    sPos[i*6]=s.x; sPos[i*6+1]=s.y; sPos[i*6+2]=s.z-len; sPos[i*6+3]=s.x; sPos[i*6+4]=s.y; sPos[i*6+5]=s.z; }
  sGeo.attributes.position.needsUpdate=true;
  elVig.style.opacity=clamp((sp-30)/40,0,0.9);
  precipTick(dt); windscreenTick(dt); lightningTick(dt); lightPoolTick(); cloudTick(dt); coneMat.opacity=(HEADL[wxName]||HEADL.sunny)[1]; glowMat.opacity=0.35+0.4*(HEADL[wxName]||HEADL.sunny)[0]/1.3;

  if(state==='play'){
    elScore.firstChild.nodeValue=score(); elSpeed.firstChild.nodeValue=Math.round(sp*3.6);
    if(driftPts>=5){ elDrift.textContent='sideways '+Math.floor(driftPts); elDrift.style.opacity=1; popT=0; }
    else if(popT>0){ popT-=dt; if(popT<=0) elDrift.style.opacity=0; } else elDrift.style.opacity=0;
  }
  if(flash>0){ flash=Math.max(0,flash-dt*2.5); elFlash.style.opacity=flash*0.85; }
  if(state==='play') runT+=dt; if(state==='count') runT=0; audioTick(); frameNo++; if(frameNo&1) drawMap(); else drawGauge(); drawTimer();
  // adaptive resolution: drop render scale if frames are slow, raise it back when there's headroom
  frameEma+=(dt-frameEma)*0.05; if(now-lastPrCheck>1500){ lastPrCheck=now;
    if(frameEma>1/45&&pixelScale>0.6){ pixelScale=Math.max(0.6,pixelScale-0.15); applyPixelScale(); }
    else if(frameEma<1/70&&pixelScale<maxScale){ pixelScale=Math.min(maxScale,pixelScale+0.1); applyPixelScale(); } }
  if(NET.navDemo){ for(let i=0;i<pts.length;i++) NET.navPts[trimmed+i]=[pts[i].x,pts[i].y,pts[i].w];
    NET.st={x:car.x,y:car.y,h:car.h,sp:Math.round(car.speed*3.6),g:car.gear+1,m:score(),st:state,ct:countT,idx:trimmed+car.idx,air:car.air};
    if(!NC.init){ NC.x=car.x; NC.y=car.y; NC.h=car.h; NC.init=true; } drawNav(dt); requestAnimationFrame(frame); return; }
  if(frameNo%2===0) renderMirrors(); renderer.render(scene,camera);   // each mirror refreshes ~10x per second
  requestAnimationFrame(frame);
}

/* headless self-test: the bot drives `secs` of game time */
window.__sim=(secs=120,keep)=>{
  const sb=bot, ss=state; bot=true; state='title'; reset(); let crashes=0, legs=[], offT=0, top=0, airT=0;
  for(let t=0;t<secs;t+=STEP){ const before=car.far; step(STEP); top=Math.max(top,car.speed); if(car.off) offT+=STEP; if(car.air) airT+=STEP; if(car.far<before-1){ crashes++; legs.push(Math.round(before)); } }
  legs.push(Math.round(car.far)); bot=sb; state=ss; if(!keep) reset(); return {crashes,legs,offSecs:Math.round(offT),airSecs:+airT.toFixed(1),topKmh:Math.round(top*3.6)};
};
window.__game={ get pts(){return pts;}, hillH, groundH, get car(){return car;}, get head(){return head;}, get state(){return state;}, start, demo(){ start(); bot=true; }, setWeather:n=>applyWeather(n), setDiff:d=>{ D=DIFFS[d]; }, get wx(){return wxName;}, buildWindow:()=>buildWindow(), tick(n){ for(let i=0;i<n;i++) frame(last+16.7); }, get net(){ return {mode:NET.mode,role:myRole(),ready:NET.ready,navActive:NET.navActive,navDead:NET.navDead,pts:NET.navPts.length,st:NET.st}; }, get scr(){return scr;},
  navDemo(on){ NET.navDemo=on; NET.navPts=[]; NC.init=false; NET.wx=wxName; elNav.classList.toggle('hidden',!on); elNavUI.classList.toggle('hidden',!on); if(on) navResize(); },
  call:k=>showCall(k), wreck(){ bot=false; crash('hugged a tree'); }, bolt(){ nextBolt=0; } };

cockpit.traverse(o=>o.layers.set(1)); sLines.layers.set(1); camera.layers.enable(1);
setColor(settings.color); applyWeather(pickWeather()); renderMenu(); showScreen('mode'); reset(); requestAnimationFrame(frame);
})();
