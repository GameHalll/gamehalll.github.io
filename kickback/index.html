<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Kickback</title>
<style>
html,body{margin:0;height:100%;background:#151a23;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:0 0}
canvas{position:absolute;inset:0;width:1280px;height:720px;display:block;cursor:crosshair}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#fff;text-align:center;background:rgba(17,21,28,.6)}
.screen.on{display:flex}
h1{font-size:104px;line-height:.9;margin:0;font-weight:900;letter-spacing:-3px;color:#ffcf4a;text-shadow:0 7px 0 #b3472c,0 14px 0 rgba(0,0,0,.35);transform:rotate(-3deg)}
h2{font-size:58px;margin:0;font-weight:900;color:#ffcf4a;text-shadow:0 5px 0 #b3472c}
.tag{font-size:22px;font-weight:700;opacity:.9;margin:6px 0 12px}
.small{font-size:16px;opacity:.75;line-height:1.5;font-weight:600}
button{font:inherit;font-weight:900;font-size:26px;padding:14px 34px;min-width:300px;border:0;border-radius:16px;background:#ffcf4a;color:#2b1b3d;box-shadow:0 6px 0 #b9862a;cursor:pointer}
button:hover{filter:brightness(1.08)}
button:active{transform:translateY(4px);box-shadow:0 2px 0 #b9862a}
button.alt{background:#37d6c0;box-shadow:0 6px 0 #1f8f80}
button.alt:active{box-shadow:0 2px 0 #1f8f80}
button.ghost{background:#3b4658;color:#fff;box-shadow:0 6px 0 #232a36}
button.ghost:active{box-shadow:0 2px 0 #232a36}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.row button{min-width:200px}
#shopGrid{display:grid;grid-template-columns:repeat(4,250px);gap:14px}
.card{background:#2a3342;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px;align-items:center;border:3px solid transparent}
.card.eq{border-color:#37d6c0}
.card b{font-size:22px}
.card span{font-size:14px;opacity:.8;min-height:34px;font-weight:600}
.card button{min-width:0;width:100%;font-size:19px;padding:9px 0}
.card button:disabled{opacity:.45;cursor:default}
#coinsTop{font-size:28px;font-weight:900;color:#ffcf4a}
#mute{position:absolute;right:14px;bottom:12px;min-width:0;font-size:16px;padding:8px 14px;box-shadow:0 4px 0 #232a36}
h3{margin:6px 0 0;font-size:20px;opacity:.85}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>

  <div class="screen on" id="sMenu">
    <h1>KICKBACK</h1>
    <div class="tag">Wobbly gunfights where every shot shoves you around.</div>
    <button id="bSolo">PLAY SOLO</button>
    <button id="bDuel" class="alt">2 PLAYER DUEL</button>
    <button id="bShop" class="ghost">SHOP</button>
    <div class="small" id="bestLine"></div>
  </div>

  <div class="screen" id="sShop">
    <h2>SHOP</h2>
    <div id="coinsTop"></div>
    <h3>GUNS</h3>
    <div id="shopGrid"></div>
    <h3>HATS</h3>
    <div id="hatGrid" style="display:grid;grid-template-columns:repeat(5,198px);gap:14px"></div>
    <button id="bShopBack" class="ghost">BACK</button>
  </div>

  <div class="screen" id="sOver">
    <h2 id="overTitle">WIPED OUT</h2>
    <div class="tag" id="overText"></div>
    <div class="row">
      <button id="bRetry">PLAY AGAIN</button>
      <button id="bOverShop" class="alt">SHOP</button>
      <button id="bOverMenu" class="ghost">MENU</button>
    </div>
  </div>

  <div class="screen" id="sPause">
    <h2>PAUSED</h2>
    <div class="row">
      <button id="bResume">RESUME</button>
      <button id="bQuit" class="ghost">MENU</button>
    </div>
  </div>

  <button id="mute" class="ghost">SOUND: ON</button>
</div>

<script>
'use strict';
/* ---------- setup ---------- */
const W=1280,H=720,h=1/120,G=1500,ROCKG=520;
const stage=document.getElementById('stage'),cv=document.getElementById('c'),ctx=cv.getContext('2d');
let Q=1;
function resize(){
  const s=Math.min(innerWidth/W,innerHeight/H);
  stage.style.transform=`scale(${s}) translate(-50%,-50%)`;
  Q=Math.min(2,Math.max(1,s*(devicePixelRatio||1)));
  cv.width=W*Q;cv.height=H*Q;
}
addEventListener('resize',resize);resize();
const $=id=>document.getElementById(id);
const rnd=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shade(hex,f){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const m=v=>Math.max(0,Math.min(255,Math.round(f<0?v*(1+f):v+(255-v)*f)));return`rgb(${m(r)},${m(g)},${m(b)})`}

/* ---------- data ---------- */
const GUNS=[
 {id:'pistol',name:'Pistol',desc:'Six shots. Bullets bounce twice.',mag:6,rel:1.1,cd:.25,dmg:20,spd:1150,rec:150,pel:1,spr:.015,bnc:2,price:0,len:22},
 {id:'shotgun',name:'Shotgun',desc:'Short range. Kicks hard enough to jump.',mag:2,rel:1.3,cd:.4,dmg:9,spd:1000,rec:950,pel:7,spr:.24,bnc:0,life:.3,price:200,len:34},
 {id:'sniper',name:'Sniper',desc:'One huge shot. Punches through crates.',mag:1,rel:1.5,cd:.3,dmg:75,spd:2300,rec:520,pel:1,spr:0,bnc:1,pierce:2,price:600,len:46},
 {id:'bazooka',name:'Bazooka',desc:'Arcing rocket. Blows up crates and you.',mag:1,rel:2.1,cd:.3,dmg:70,spd:680,rec:700,pel:1,spr:0,bnc:0,rocket:1,price:1200,len:40}
];
const HATS=[
 {id:'none',name:'No hat',price:0},{id:'cowboy',name:'Cowboy',price:80},{id:'top',name:'Top hat',price:200},
 {id:'cone',name:'Traffic cone',price:350},{id:'crown',name:'Crown',price:900}
];
let save={coins:0,guns:[true,false,false,false],gun:0,hats:[true,false,false,false,false],hat:0,best:0,muted:false};
try{const s=JSON.parse(localStorage.getItem('kickback_save'));if(s)save=Object.assign(save,s)}catch(e){}
function persist(){try{localStorage.setItem('kickback_save',JSON.stringify(save))}catch(e){}}

/* CrazyGames SDK hooks: safe no-ops until the SDK script is added */
const SDK={
  start(){try{window.CrazyGames&&CrazyGames.SDK.game.gameplayStart()}catch(e){}},
  stop(){try{window.CrazyGames&&CrazyGames.SDK.game.gameplayStop()}catch(e){}}
};

/* ---------- sound ---------- */
let AC=null,noiseBuf=null;
function audio(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();noiseBuf=AC.createBuffer(1,AC.sampleRate*.6,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}catch(e){AC=null}}
  if(AC&&AC.state==='suspended')AC.resume();
  return AC;
}
function tone(type,f0,f1,dur,vol){const a=AC,o=a.createOscillator(),g=a.createGain(),t=a.currentTime;o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur)}
function noise(freq,dur,vol,type='bandpass'){const a=AC,s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain(),t=a.currentTime;s.buffer=noiseBuf;f.type=type;f.frequency.value=freq;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f).connect(g).connect(a.destination);s.start(t);s.stop(t+dur)}
function snd(n){
  if(save.muted||!audio())return;
  if(n==='pistol'){noise(1800,.12,.5);tone('square',220,60,.08,.2)}
  else if(n==='shotgun'){noise(900,.25,.8);tone('square',140,40,.15,.3)}
  else if(n==='sniper'){noise(2600,.3,.6);tone('sawtooth',400,50,.25,.25)}
  else if(n==='bazooka'){noise(500,.35,.6,'lowpass');tone('sine',180,60,.3,.3)}
  else if(n==='ping')tone('sine',rnd(1700,2300),900,.12,.12)
  else if(n==='hit')tone('sine',190,60,.14,.5)
  else if(n==='wood')noise(600,.1,.4)
  else if(n==='boom'){noise(220,.7,1,'lowpass');tone('sine',110,30,.5,.6)}
  else if(n==='coin'){tone('square',880,880,.07,.12);setTimeout(()=>AC&&!save.muted&&tone('square',1320,1320,.1,.12),70)}
  else if(n==='click')tone('square',320,200,.04,.12)
  else if(n==='reload'){tone('square',500,300,.04,.12);setTimeout(()=>AC&&!save.muted&&tone('square',700,500,.05,.12),90)}
}

/* ---------- world state ---------- */
let state='menu',mode='solo',wave=1,solids=[],dolls=[],bullets=[],parts=[],texts=[];
let player=null,p2=null,shake=0,slowmo=0,flowT=0,runCoins=0,score=[0,0],hintT=0,bannerT=0,banner='';
const mouse={x:900,y:300,down:false},keys={};

function plat(x,y,w,hh=18){const s={x,y,w,h:hh,type:'metal'};solids.push(s);return s}
function crate(x,y,s=44){const c={x,y:y-s,w:s,h:s,type:'wood',hp:40,vy:0};solids.push(c);return c}

function makeDoll(x,y,facing,o){
  const f=facing,P=(dx,dy,r)=>({x:x+dx,y:y+dy,px:x+dx,py:y+dy,r,g:false});
  const p={head:P(0,-97,15),neck:P(0,-79,5),hip:P(0,-43,6),elbF:P(10*f,-66,4),handF:P(26*f,-62,4),elbB:P(-7*f,-62,4),handB:P(-9*f,-45,4),kneeL:P(-7,-22,4),footL:P(-11,-5,5),kneeR:P(7,-22,4),footR:P(11,-5,5)};
  const S=(a,b,k=1)=>({a:p[a],b:p[b],len:Math.hypot(p[a].x-p[b].x,p[a].y-p[b].y),k});
  const d={p,pl:Object.values(p),facing:f,
    sticks:[S('head','neck'),S('neck','hip'),S('head','hip',.4),S('neck','elbF'),S('elbF','handF'),S('neck','elbB'),S('elbB','handB'),S('hip','kneeL'),S('kneeL','footL'),S('hip','kneeR'),S('kneeR','footR')],
    team:'enemy',col:'#ef5b6b',alive:true,hp:100,maxHp:100,stun:0,groundT:.2,aim:f>0?0:Math.PI,gun:0,
    gs:GUNS.map(g=>({ammo:g.mag,cd:0,rel:0})),owned:[true,true,true,true],hat:0,ai:null,human:0,recMul:1,dmgMul:1,fade:1,deadT:0,gone:false,flash:0};
  return Object.assign(d,o);
}

function buildArena(){
  solids=[];bullets=[];parts=[];texts=[];dolls=[];
  if(mode==='duel'){
    plat(120,470,270);plat(890,470,270);plat(540,270,200,16);plat(560,580,160);
    crate(618,580);crate(618,536);crate(346,470);crate(890,470);
    plat(631,90,18,110);
    player=makeDoll(230,470,1,{team:'p1',col:'#37d6c0',human:1,hat:save.hat});
    p2=makeDoll(1050,470,-1,{team:'p2',col:'#ffb23e',human:2,hat:1});
    dolls.push(player,p2);return;
  }
  const R=rng(wave*977+31);
  plat(110,480,270);
  if(wave>=2)crate(336,480);
  const hp=player&&player.alive?Math.min(100,player.hp+35):100,gun=player?player.gun:save.gun;
  player=makeDoll(215,480,1,{team:'p1',col:'#37d6c0',human:1,hat:save.hat,owned:save.guns.slice(),gun,hp});
  dolls.push(player);p2=null;
  const n=Math.min(1+Math.floor((wave-1)/2),4);
  const ys=[230,345,460,575].sort(()=>R()-.5).slice(0,n);
  for(const y of ys){
    const w=150+R()*50,x=700+R()*(1180-700-w),pl=plat(x,y,w);
    let gun=0;const r=R();
    if(wave>=6&&r<.22)gun=3;else if(wave>=4&&r<.5)gun=2;
    if(wave>=2&&R()<.45)crate(pl.x,pl.y);
    const e=makeDoll(pl.x+w/2+18,y,-1,{col:['#ef5b6b','#ef5b6b','#b06cff','#9bd14b'][gun],gun,hp:Math.min(110,34+wave*6),recMul:.45,dmgMul:Math.min(.9,.35+wave*.05),hat:R()<.3?1+Math.floor(R()*4):0,
      ai:{t:1.8+R()*1.6,err:0,int:Math.max(1.25,3.2-wave*.15),acc:Math.max(.03,.19-wave*.014)}});
    e.maxHp=e.hp;dolls.push(e);
  }
  plat(470+R()*130,130+R()*90,170,16);
  if(wave>=3)plat(540+R()*70,360+R()*130,18,120);
  if(wave>=5)plat(430+R()*90,610+R()*40,150,16);
}

/* ---------- physics ---------- */
function collide(q){
  for(const s of solids){
    if(q.x>s.x-q.r&&q.x<s.x+s.w+q.r&&q.y>s.y-q.r&&q.y<s.y+s.h+q.r){
      const dl=q.x-(s.x-q.r),dr=s.x+s.w+q.r-q.x,dt=q.y-(s.y-q.r),db=s.y+s.h+q.r-q.y,m=Math.min(dl,dr,dt,db);
      if(m===dt){q.y=s.y-q.r;q.g=true}else if(m===db)q.y=s.y+s.h+q.r;else if(m===dl)q.x=s.x-q.r;else q.x=s.x+s.w+q.r;
    }
  }
}
function bal(q,tx,ty,k,fvx,fvy){
  q.x+=(tx-q.x)*k;q.y+=(ty-q.y)*k;
  const vx=q.x-q.px,vy=q.y-q.py;q.px=q.x-(fvx+(vx-fvx)*.8);q.py=q.y-(fvy+(vy-fvy)*.8);
}
function stepDoll(d){
  const p=d.p;
  for(const q of d.pl){const vx=(q.x-q.px)*.9985,vy=(q.y-q.py)*.9985;q.px=q.x;q.py=q.y;q.x+=vx;q.y+=vy+G*h*h;q.g=false}
  if(d.alive){
    if(d.stun<=0&&d.groundT>0){
      const fx=(p.footL.x+p.footR.x)/2,fy=(p.footL.y+p.footR.y)/2;
      const fvx=(p.footL.x-p.footL.px+p.footR.x-p.footR.px)/2,fvy=(p.footL.y-p.footL.py+p.footR.y-p.footR.py)/2,K=.14;
      bal(p.hip,fx,fy-38,K,fvx,fvy);bal(p.neck,fx+d.facing*2,fy-74,K,fvx,fvy);bal(p.head,fx+d.facing*3,fy-92,K,fvx,fvy);
      bal(p.kneeL,fx-8,fy-18,K*.5,fvx,fvy);bal(p.kneeR,fx+8,fy-18,K*.5,fvx,fvy);
      p.footL.x+=(fx-12-p.footL.x)*.03;p.footR.x+=(fx+12-p.footR.x)*.03;
    }
    const tx=p.neck.x+Math.cos(d.aim)*30,ty=p.neck.y+4+Math.sin(d.aim)*30;
    p.handF.x+=(tx-p.handF.x)*.3;p.handF.y+=(ty-p.handF.y)*.3;
  }
  for(let it=0;it<5;it++){
    for(const s of d.sticks){const dx=s.b.x-s.a.x,dy=s.b.y-s.a.y,dist=Math.hypot(dx,dy)||1e-6,k=(dist-s.len)/dist*.5*s.k;s.a.x+=dx*k;s.a.y+=dy*k;s.b.x-=dx*k;s.b.y-=dy*k}
    for(const q of d.pl)collide(q);
  }
  const fr=d.alive&&d.stun<=0?.86:.95;
  for(const q of d.pl)if(q.g){const vx=q.x-q.px;q.px=q.x-vx*fr}
  if(p.footL.g||p.footR.g)d.groundT=.12;
}
function impulse(d,vx,vy){for(const q of d.pl){q.px-=vx*h;q.py-=vy*h}}
function waddle(d,dir){
  if(!dir||!d.alive||d.stun>0||d.groundT<=0)return;
  const want=dir*190*h;
  for(const q of d.pl){const vx=q.x-q.px;q.px=q.x-(vx+(want-vx)*.12)}
}

function spark(x,y,col,n,spd=260,life=.35,size=3,grav=600){
  if(parts.length>500)return;
  for(let i=0;i<n;i++){const a=rnd(Math.PI*2),s=rnd(spd*.3,spd);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(life*.5,life),max:life,col,size:rnd(size*.5,size),grav})}
}
function addText(x,y,txt,col='#fff',size=22){texts.push({x,y,txt,col,size,t:0})}
function addCoins(n,x,y){save.coins+=n;runCoins+=n;addText(x,y,'+'+n,'#ffcf4a',24);snd('coin')}

function fire(d){
  const g=GUNS[d.gun],st=d.gs[d.gun];
  if(!d.alive||st.cd>0||st.rel>0||st.ammo<=0)return false;
  st.ammo--;st.cd=g.cd;if(st.ammo<=0)st.rel=g.rel;
  const a=d.aim,ca=Math.cos(a),sa=Math.sin(a),hx=d.p.handF.x,hy=d.p.handF.y;
  let ox=hx+ca*g.len*1.35,oy=hy+sa*g.len*1.35;
  for(const s of solids)if(ox>s.x&&ox<s.x+s.w&&oy>s.y&&oy<s.y+s.h){ox=hx;oy=hy;break}
  for(let i=0;i<g.pel;i++){
    const aa=a+(Math.random()-.5)*2*g.spr,sp=g.spd*(g.pel>1?rnd(.8,1.15):1);
    bullets.push({x:ox,y:oy,vx:Math.cos(aa)*sp,vy:Math.sin(aa)*sp,g,owner:d,bnc:g.bnc,dmg:g.dmg*d.dmgMul,life:g.life||2.6,age:0,pierce:g.pierce||0,bounced:false,trail:[]});
  }
  const rk=g.rec*d.recMul;impulse(d,-ca*rk,-sa*rk);
  spark(ox,oy,'#ffe9a8',g.pel>1?10:5,300,.15,4,0);
  shake=Math.max(shake,g.rec/90);snd(g.id);
  return true;
}
function reload(d){const g=GUNS[d.gun],st=d.gs[d.gun];if(st.rel<=0&&st.ammo<g.mag){st.ammo=0;st.rel=g.rel;if(d.human)snd('click')}}
function switchGun(d,i){if(!d.alive||i===d.gun||!d.owned[i])return;const st=d.gs[d.gun];if(st.rel>0)st.rel=GUNS[d.gun].rel;d.gun=i;d.gs[i].cd=Math.max(d.gs[i].cd,.2);snd('click')}
function cycleGun(d,dir=1){let i=d.gun;for(let k=0;k<4;k++){i=(i+dir+4)%4;if(d.owned[i]){switchGun(d,i);return}}}

const SEGS=[['neck','hip',13,1],['neck','elbF',7,.6],['elbF','handF',7,.6],['neck','elbB',7,.6],['elbB','handB',7,.6],['hip','kneeL',8,.6],['kneeL','footL',8,.6],['hip','kneeR',8,.6],['kneeR','footR',8,.6]];
function hitTest(d,x,y){
  const p=d.p;
  if(Math.hypot(x-p.head.x,y-p.head.y)<p.head.r+3)return{mult:2,head:true,pts:[p.head,p.neck]};
  for(const[a,b,th,m]of SEGS){
    const A=p[a],B=p[b],dx=B.x-A.x,dy=B.y-A.y,l=dx*dx+dy*dy||1,t=Math.max(0,Math.min(1,((x-A.x)*dx+(y-A.y)*dy)/l));
    if(Math.hypot(x-(A.x+dx*t),y-(A.y+dy*t))<th)return{mult:m,head:false,pts:[A,B]};
  }
  return null;
}
function damage(d,amt,b,head){
  if(!d.alive)return;
  d.hp-=amt;d.stun=Math.max(d.stun,.28);d.flash=.12;
  addText(d.p.head.x+rnd(-14,14),d.p.head.y-30,head?'HEADSHOT '+Math.round(amt):''+Math.round(amt),head?'#ffcf4a':'#fff',head?24:20);
  if(d.hp<=0)kill(d,b,head);
}
function kill(d,b,head){
  if(!d.alive)return;
  d.alive=false;d.hp=0;slowmo=.35;shake=Math.max(shake,9);
  spark(d.p.neck.x,d.p.neck.y,d.col,16,340,.6,5);
  if(mode==='solo'&&d.team==='enemy'){
    let c=10;const mine=b&&b.owner===player;
    if(mine&&head)c+=5;
    if(mine&&b.bounced){c+=10;addText(d.p.head.x,d.p.head.y-64,'TRICK SHOT!','#37d6c0',28)}
    addCoins(c,d.p.head.x,d.p.head.y-46);
  }
}
function hitCrate(s,dmg,x,y){
  s.hp-=dmg;spark(x,y,'#c98f5a',6,220,.4,5);snd('wood');
  if(s.hp<=0){const i=solids.indexOf(s);if(i>=0)solids.splice(i,1);spark(s.x+s.w/2,s.y+s.h/2,'#b9783f',18,320,.6,8);spark(s.x+s.w/2,s.y+s.h/2,'#8a5527',10,260,.6,6)}
}
function explode(x,y,b){
  const R=150;
  for(const d of dolls){
    if(d.gone)continue;
    const dx=d.p.hip.x-x,dy=d.p.hip.y-20-y,dist=Math.hypot(dx,dy)||1;
    if(dist<R){const f=1-dist/R;impulse(d,dx/dist*950*f,dy/dist*950*f-320*f);d.stun=Math.max(d.stun,.7);damage(d,b.dmg*(.35+.65*f),b,false)}
  }
  for(const s of solids.slice())if(s.type==='wood'&&Math.hypot(s.x+s.w/2-x,s.y+s.h/2-y)<R)hitCrate(s,200,s.x+s.w/2,s.y+s.h/2);
  spark(x,y,'#ffcf4a',26,520,.5,9,200);spark(x,y,'#ff7a3d',22,380,.6,11,100);spark(x,y,'#55495f',16,200,.9,14,-80);
  shake=Math.max(shake,16);snd('boom');
}
function stepBullets(){
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];b.age+=h;if(b.g.rocket){b.vy+=ROCKG*h;if(Math.random()<.5)parts.push({x:b.x,y:b.y,vx:rnd(-20,20),vy:rnd(-20,20),life:.4,max:.4,col:'#8a7f96',size:rnd(4,8),grav:-60})}
    let dx=b.vx*h,dy=b.vy*h;const n=Math.max(1,Math.ceil(Math.hypot(dx,dy)/5));dx/=n;dy/=n;let dead=false;
    for(let k=0;k<n&&!dead;k++){
      const ox=b.x,oy=b.y;b.x+=dx;b.y+=dy;
      for(const s of solids){
        if(b.x>s.x&&b.x<s.x+s.w&&b.y>s.y&&b.y<s.y+s.h){
          if(b.g.rocket){explode(ox,oy,b);dead=true;break}
          if(s.type==='wood'){hitCrate(s,b.dmg*(b.pierce?9:1),b.x,b.y);if(b.pierce>0&&s.hp<=0)b.pierce--;else dead=true;break}
          spark(ox,oy,'#ffe9a8',5,240,.25,3);
          if(b.bnc>0){b.bnc--;b.bounced=true;if(ox<=s.x||ox>=s.x+s.w){b.vx=-b.vx;dx=-dx}else{b.vy=-b.vy;dy=-dy}b.x=ox;b.y=oy;b.dmg*=.85;snd('ping')}else dead=true;
          break;
        }
      }
      if(dead)break;
      for(const d of dolls){
        if(d.gone||!d.alive||(d===b.owner&&b.age<.15))continue;
        if(Math.abs(b.x-d.p.hip.x)>90||Math.abs(b.y-d.p.hip.y)>110)continue;
        const hit=hitTest(d,b.x,b.y);
        if(hit){
          if(b.g.rocket)explode(b.x,b.y,b);
          else{
            for(const q of hit.pts){q.px-=b.vx*h*.13;q.py-=b.vy*h*.13}
            impulse(d,b.vx*.05,b.vy*.05);spark(b.x,b.y,'#fff',6,260,.3,4);snd('hit');
            damage(d,b.dmg*hit.mult,b,hit.head);
          }
          dead=true;break;
        }
      }
    }
    b.trail.push(b.x,b.y);if(b.trail.length>16)b.trail.splice(0,2);
    if(dead||b.age>b.life||b.x<-60||b.x>W+60||b.y<-400||b.y>H+60)bullets.splice(i,1);
  }
}

/* ---------- control ---------- */
function angLerp(a,b,t){let d=b-a;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;return a+d*Math.min(1,t)}
function control(){
  if(mode==='solo'){
    const d=player;
    if(d.alive){
      d.aim=Math.atan2(mouse.y-d.p.neck.y,mouse.x-d.p.neck.x);
      if(mouse.down||keys[' '])fire(d);
      waddle(d,(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0));
    }
    for(const e of dolls){
      if(!e.ai||!e.alive)continue;
      const g=GUNS[e.gun],T=player.p.neck,S=e.p.neck;let dx=T.x-S.x,dy=T.y+16-S.y;
      if(g.rocket){const t=Math.hypot(dx,dy)/g.spd;dy-=.5*ROCKG*t*t}
      e.aim=angLerp(e.aim,Math.atan2(dy,dx)+e.ai.err,5*h);
      if(!player.alive)continue;
      e.ai.t-=h;
      if(e.ai.t<=0&&e.stun<=0){
        const st=e.gs[e.gun];st.ammo=g.mag;st.rel=0;st.cd=0;fire(e);
        e.ai.t=e.ai.int*rnd(.8,1.25)*(e.gun===2?1.35:1)*(e.gun===3?1.5:1);e.ai.err=rnd(-1,1)*e.ai.acc;
      }
    }
  }else{
    const r=2.6*h;
    if(player.alive){if(keys.w)player.aim-=r;if(keys.s)player.aim+=r;if(keys.d)fire(player)}
    if(p2.alive){if(keys.arrowup)p2.aim+=r;if(keys.arrowdown)p2.aim-=r;if(keys.arrowleft)fire(p2)}
  }
}

/* ---------- step ---------- */
function step(){
  if(state==='play')control();
  for(const d of dolls){
    if(d.gone)continue;
    d.stun-=h;d.groundT-=h;d.flash-=h;
    const st=d.gs[d.gun];st.cd-=h;
    if(st.rel>0){st.rel-=h;if(st.rel<=0){st.ammo=GUNS[d.gun].mag;if(d.human)snd('reload')}}
    stepDoll(d);
    if(d.p.hip.y>H+140){if(d.alive){if(d.human||mode==='duel')addText(Math.max(80,Math.min(W-80,d.p.hip.x)),H-60,'FELL!','#ff8a8a',26);kill(d,null,false)}d.gone=true}
    if(!d.alive){d.deadT+=h;if(d.deadT>3.5){d.fade-=h*1.5;if(d.fade<=0)d.gone=true}}
  }
  for(const c of solids){
    if(c.type!=='wood')continue;
    c.vy+=G*h;c.y+=c.vy*h;
    for(const o of solids){if(o===c)continue;if(c.x<o.x+o.w&&c.x+c.w>o.x&&c.y+c.h>o.y&&c.y<o.y+o.h&&c.y+c.h-o.y<24){c.y=o.y-c.h;c.vy=0}}
  }
  for(let i=solids.length-1;i>=0;i--)if(solids[i].y>H+100)solids.splice(i,1);
  stepBullets();
  for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.life-=h;if(q.life<=0){parts.splice(i,1);continue}q.vy+=q.grav*h;q.x+=q.vx*h;q.y+=q.vy*h}
  for(let i=texts.length-1;i>=0;i--){const t=texts[i];t.t+=h;t.y-=38*h;if(t.t>1.1)texts.splice(i,1)}
  if(state!=='play')return;
  hintT-=h;bannerT-=h;
  if(mode==='solo'){
    if(!player.alive){flowT+=h;if(flowT>1.5)endRun()}
    else if(dolls.every(d=>!d.ai||!d.alive)){
      if(flowT===0){addCoins(15+wave*2,player.p.head.x,player.p.head.y-60);banner='WAVE CLEAR';bannerT=1.2}
      flowT+=h;if(flowT>1.4){wave++;flowT=0;buildArena();banner='WAVE '+wave;bannerT=1.3}
    }
  }else if(!player.alive||!p2.alive){
    flowT+=h;
    if(flowT>1.7){
      flowT=0;
      if(player.alive!==p2.alive)score[player.alive?0:1]++;
      const draw=player.alive===p2.alive;
      if(score[0]>=3||score[1]>=3)endRun();else{buildArena();banner=(draw?'DRAW!  ':'')+score[0]+' - '+score[1];bannerT=1.3}
    }
  }
}

/* ---------- flow ---------- */
function show(id){for(const s of document.querySelectorAll('.screen'))s.classList.toggle('on',s.id===id)}
function startGame(m){
  audio();mode=m;wave=1;runCoins=0;score=[0,0];flowT=0;player=null;buildArena();
  state='play';show('');hintT=7;banner=m==='solo'?'WAVE 1':'FIRST TO 3';bannerT=1.4;mouse.down=false;SDK.start();
}
function endRun(){
  state='over';SDK.stop();
  if(mode==='solo'){
    const nb=wave>save.best;if(nb)save.best=wave;persist();
    $('overTitle').textContent='WIPED OUT';
    $('overText').textContent=`You reached wave ${wave}${nb?' (new best!)':''} and earned ${runCoins} coins.`;
  }else{
    $('overTitle').textContent=score[0]>score[1]?'TEAL WINS':'ORANGE WINS';
    $('overText').textContent=`Final score ${score[0]} - ${score[1]}`;
  }
  show('sOver');
}
function toMenu(){
  state='menu';SDK.stop();persist();mode='solo';wave=1;player=null;buildArena();for(const d of dolls)if(d.ai)d.ai.t=1e9;
  $('bestLine').textContent=(save.best?`Best wave: ${save.best}   ·   `:'')+`Coins: ${save.coins}`;
  show('sMenu');
}
let shopFrom='sMenu';
function openShop(from){
  shopFrom=from;$('coinsTop').textContent=save.coins+' coins';
  const mk=(list,owned,eqKey,grid)=>{
    grid.innerHTML='';
    list.forEach((it,i)=>{
      const c=document.createElement('div');c.className='card'+(save[eqKey]===i?' eq':'');
      const has=save[owned][i];
      c.innerHTML=`<b>${it.name}</b>${it.desc?`<span>${it.desc}</span>`:''}`;
      const b=document.createElement('button');
      if(save[eqKey]===i){b.textContent='EQUIPPED';b.disabled=true}
      else if(has){b.textContent='EQUIP';b.className='alt';b.onclick=()=>{save[eqKey]=i;persist();snd('click');openShop(from)}}
      else{b.textContent=it.price+' coins';b.disabled=save.coins<it.price;b.onclick=()=>{save.coins-=it.price;save[owned][i]=true;save[eqKey]=i;persist();snd('coin');openShop(from)}}
      c.appendChild(b);grid.appendChild(c);
    });
  };
  mk(GUNS,'guns','gun',$('shopGrid'));mk(HATS,'hats','hat',$('hatGrid'));
  show('sShop');
}
$('bSolo').onclick=()=>startGame('solo');$('bDuel').onclick=()=>startGame('duel');
$('bShop').onclick=()=>openShop('sMenu');$('bOverShop').onclick=()=>openShop('sOver');
$('bShopBack').onclick=()=>{if(shopFrom==='sMenu')toMenu();else show(shopFrom)};
$('bRetry').onclick=()=>startGame(mode);$('bOverMenu').onclick=toMenu;
$('bResume').onclick=()=>{state='play';show('');SDK.start()};$('bQuit').onclick=toMenu;

$('mute').onclick=()=>{save.muted=!save.muted;persist();setMute()};setMute();

/* ---------- input ---------- */
function slotRects(){const r=[];let x=18;for(let i=0;i<4;i++)if(player&&player.owned[i]){r.push({i,x,y:H-70,w:104,h:54});x+=112}return r}
function setMouse(e){const r=cv.getBoundingClientRect();mouse.x=(e.clientX-r.left)/r.width*W;mouse.y=(e.clientY-r.top)/r.height*H}
cv.addEventListener('pointerdown',e=>{
  setMouse(e);audio();
  if(state==='play'&&mode==='solo'){for(const s of slotRects())if(mouse.x>s.x&&mouse.x<s.x+s.w&&mouse.y>s.y&&mouse.y<s.y+s.h){switchGun(player,s.i);return}}
  mouse.down=true;
});
addEventListener('pointermove',setMouse);
addEventListener('pointerup',()=>mouse.down=false);addEventListener('pointercancel',()=>mouse.down=false);
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();
  if(e.repeat)return;keys[k]=true;
  if(k==='escape'||k==='p'){if(state==='play'){state='pause';show('sPause');SDK.stop()}else if(state==='pause'){state='play';show('');SDK.start()}return}
  if(state!=='play')return;
  if(mode==='solo'){
    if(k==='r')reload(player);if(k==='q')cycleGun(player,-1);if(k==='e')cycleGun(player,1);
    if(k>='1'&&k<='4')switchGun(player,+k-1);
  }else{
    if(k==='a')cycleGun(player);if(k==='arrowright')cycleGun(p2);
  }
});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;mouse.down=false;if(state==='play'){state='pause';show('sPause');SDK.stop()}});

/* ---------- render ---------- */
const bg=document.createElement('canvas');bg.width=W;bg.height=H;
(function(){
  const c=bg.getContext('2d');
  c.fillStyle='#1f2633';c.fillRect(0,0,W,H);
  // faint blueprint grid
  c.strokeStyle='rgba(140,170,210,.06)';c.lineWidth=1;
  for(let x=0;x<=W;x+=40){c.beginPath();c.moveTo(x+.5,0);c.lineTo(x+.5,H);c.stroke()}
  for(let y=0;y<=H;y+=40){c.beginPath();c.moveTo(0,y+.5);c.lineTo(W,y+.5);c.stroke()}
  // big faint target rings in the middle
  c.strokeStyle='rgba(140,170,210,.07)';c.lineWidth=10;
  for(const r of[90,170,250]){c.beginPath();c.arc(W/2,H/2+20,r,0,7);c.stroke()}
  c.lineWidth=6;c.beginPath();c.moveTo(W/2-300,H/2+20);c.lineTo(W/2+300,H/2+20);c.moveTo(W/2,H/2-280);c.lineTo(W/2,H/2+320);c.stroke();
  // vignette
  const v=c.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*.95);
  v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.45)');
  c.fillStyle=v;c.fillRect(0,0,W,H);
})();
function line(a,b,col,w){ctx.strokeStyle=col;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}
function drawGun(d){
  const g=GUNS[d.gun],p=d.p,a=d.alive?d.aim:Math.atan2(p.handF.y-p.elbF.y,p.handF.x-p.elbF.x);
  ctx.save();ctx.translate(p.handF.x,p.handF.y);ctx.rotate(a);ctx.scale(1.35,Math.cos(a)<0?-1.35:1.35);
  ctx.fillStyle='#1c1622';
  if(g.id==='pistol'){ctx.fillRect(-4,-4,g.len+2,7);ctx.fillRect(-4,0,7,11)}
  else if(g.id==='shotgun'){ctx.fillRect(-8,-4,g.len+6,8);ctx.fillStyle='#8a5527';ctx.fillRect(-14,-3,12,9);ctx.fillRect(8,3,14,4)}
  else if(g.id==='sniper'){ctx.fillRect(-10,-3,g.len+8,6);ctx.fillRect(-12,-2,8,10);ctx.fillStyle='#4f6d86';ctx.fillRect(4,-9,16,5)}
  else{ctx.fillStyle='#4c6b2f';ctx.fillRect(-16,-7,g.len+16,13);ctx.fillStyle='#1c1622';ctx.fillRect(g.len-4,-9,6,17);ctx.fillRect(-2,5,6,9)}
  ctx.restore();
}
function drawHat(d){
  const p=d.p,a=Math.atan2(p.head.y-p.neck.y,p.head.x-p.neck.x)+Math.PI/2;
  ctx.save();ctx.translate(p.head.x,p.head.y);ctx.rotate(a);
  const id=HATS[d.hat].id;
  if(id==='cowboy'){ctx.fillStyle='#7a4a24';ctx.beginPath();ctx.ellipse(0,-9,24,5,0,0,7);ctx.fill();ctx.fillRect(-11,-25,22,16);ctx.fillStyle='#c94f3b';ctx.fillRect(-11,-14,22,4)}
  else if(id==='top'){ctx.fillStyle='#15101c';ctx.fillRect(-19,-13,38,5);ctx.fillRect(-12,-38,24,26);ctx.fillStyle='#c94f3b';ctx.fillRect(-12,-19,24,5)}
  else if(id==='cone'){ctx.fillStyle='#ff7a2f';ctx.beginPath();ctx.moveTo(-14,-9);ctx.lineTo(0,-42);ctx.lineTo(14,-9);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(-9,-24,18,5);ctx.fillStyle='#ff7a2f';ctx.fillRect(-18,-11,36,5)}
  else if(id==='crown'){ctx.fillStyle='#ffcf4a';ctx.beginPath();ctx.moveTo(-14,-9);ctx.lineTo(-14,-26);ctx.lineTo(-7,-17);ctx.lineTo(0,-29);ctx.lineTo(7,-17);ctx.lineTo(14,-26);ctx.lineTo(14,-9);ctx.fill()}
  ctx.restore();
}
function drawDoll(d){
  const p=d.p,c=d.flash>0?'#ffffff':d.col,dk=d.flash>0?'#ffffff':shade(d.col,-.38);
  ctx.globalAlpha=Math.max(0,d.fade);ctx.lineCap='round';
  const OL='#11151c';
  // back limbs (darker), then body with an outline pass, then front arm
  for(const[a,b,w]of[['neck','elbB',13],['elbB','handB',13],['hip','kneeL',15],['kneeL','footL',15]]){line(p[a],p[b],OL,w+5);line(p[a],p[b],dk,w)}
  for(const[a,b,w]of[['neck','hip',24],['hip','kneeR',15],['kneeR','footR',15]])line(p[a],p[b],OL,w+5);
  ctx.fillStyle=OL;ctx.beginPath();ctx.arc(p.head.x,p.head.y,p.head.r+2.5,0,7);ctx.fill();
  line(p.neck,p.hip,c,24);line(p.hip,p.kneeR,c,15);line(p.kneeR,p.footR,c,15);
  // belt stripe on the torso
  const bx=p.neck.x+(p.hip.x-p.neck.x)*.78,by=p.neck.y+(p.hip.y-p.neck.y)*.78,bx2=p.neck.x+(p.hip.x-p.neck.x)*.9,by2=p.neck.y+(p.hip.y-p.neck.y)*.9;
  ctx.strokeStyle=dk;ctx.lineWidth=24;ctx.lineCap='butt';ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx2,by2);ctx.stroke();ctx.lineCap='round';
  ctx.fillStyle=c;ctx.beginPath();ctx.arc(p.head.x,p.head.y,p.head.r,0,7);ctx.fill();
  const f=Math.cos(d.aim)>=0?1:-1,ex=p.head.x+f*6,ey=p.head.y-2;
  ctx.strokeStyle=OL;ctx.lineWidth=3;
  if(d.alive){ctx.fillStyle=OL;ctx.fillRect(ex-1-f*5,ey-3,11,5)}
  else{ctx.beginPath();ctx.moveTo(ex-4,ey-4);ctx.lineTo(ex+4,ey+4);ctx.moveTo(ex+4,ey-4);ctx.lineTo(ex-4,ey+4);ctx.stroke()}
  if(d.hat)drawHat(d);
  drawGun(d);
  line(p.neck,p.elbF,OL,18);line(p.elbF,p.handF,OL,18);
  line(p.neck,p.elbF,c,13);line(p.elbF,p.handF,c,13);
  ctx.globalAlpha=1;
  if(d.alive&&state!=='menu'){
    const x=p.head.x-26,y=p.head.y-(d.hat?58:34);
    ctx.fillStyle='rgba(18,12,26,.7)';ctx.fillRect(x-2,y-2,56,10);
    ctx.fillStyle=d.hp>35?'#6fe07a':'#ff6b5a';ctx.fillRect(x,y,52*Math.max(0,d.hp/d.maxHp),6);
    if(d.human){
      const g=GUNS[d.gun],st=d.gs[d.gun];
      if(st.rel>0){ctx.fillStyle='rgba(18,12,26,.7)';ctx.fillRect(x-2,y+10,56,7);ctx.fillStyle='#ffcf4a';ctx.fillRect(x,y+12,52*(1-st.rel/g.rel),3)}
      else for(let i=0;i<g.mag;i++){ctx.fillStyle=i<st.ammo?'#ffcf4a':'rgba(18,12,26,.6)';ctx.fillRect(x+i*9,y+11,6,6)}
    }
  }
}
function drawSolid(s){
  if(s.type==='metal'){
    ctx.fillStyle='#11151c';ctx.fillRect(s.x-3,s.y-3,s.w+6,s.h+6);
    ctx.fillStyle='#5b6678';ctx.fillRect(s.x,s.y,s.w,s.h);
    // hazard stripes along the long edge
    ctx.save();ctx.beginPath();
    if(s.w>s.h)ctx.rect(s.x,s.y,s.w,6);else ctx.rect(s.x,s.y,6,s.h);
    ctx.clip();ctx.fillStyle='#ffcf4a';ctx.fillRect(s.x,s.y,s.w,s.h);ctx.fillStyle='#11151c';
    for(let k=-s.h;k<s.w+s.h;k+=16){ctx.beginPath();ctx.moveTo(s.x+k,s.y+s.h);ctx.lineTo(s.x+k+8,s.y+s.h);ctx.lineTo(s.x+k+8+s.h,s.y);ctx.lineTo(s.x+k+s.h,s.y);ctx.fill()}
    ctx.restore();
    ctx.fillStyle='#3e4757';
    if(s.w>s.h)for(let x=s.x+12;x<s.x+s.w-6;x+=30)ctx.fillRect(x,s.y+s.h/2+1,5,5);
    else for(let y=s.y+12;y<s.y+s.h-6;y+=30)ctx.fillRect(s.x+s.w/2+1,y,5,5);
  }else{
    ctx.fillStyle=s.hp<25?'#9c6535':'#b9783f';ctx.fillRect(s.x,s.y,s.w,s.h);
    ctx.strokeStyle='#7a4a24';ctx.lineWidth=4;ctx.strokeRect(s.x+2,s.y+2,s.w-4,s.h-4);
    ctx.beginPath();ctx.moveTo(s.x+4,s.y+4);ctx.lineTo(s.x+s.w-4,s.y+s.h-4);ctx.moveTo(s.x+s.w-4,s.y+4);ctx.lineTo(s.x+4,s.y+s.h-4);ctx.stroke();
  }
}
function label(txt,x,y,size,col='#fff',align='center'){ctx.font=`900 ${size}px system-ui,sans-serif`;ctx.textAlign=align;ctx.lineJoin='round';ctx.lineWidth=size/5;ctx.strokeStyle='rgba(18,12,26,.85)';ctx.strokeText(txt,x,y);ctx.fillStyle=col;ctx.fillText(txt,x,y)}
function draw(){
  ctx.setTransform(Q,0,0,Q,0,0);
  ctx.drawImage(bg,0,0);
  const sx=(Math.random()-.5)*shake,sy=(Math.random()-.5)*shake;ctx.translate(sx,sy);
  for(const s of solids)drawSolid(s);
  // enemy sniper lasers and player aim guide
  for(const d of dolls){
    if(!d.alive||d.gone)continue;
    const g=GUNS[d.gun],ca=Math.cos(d.aim),sa=Math.sin(d.aim),mx=d.p.handF.x+ca*g.len*1.35,my=d.p.handF.y+sa*g.len*1.35;
    if(d.ai&&d.gun===2&&d.ai.t<.9&&state==='play'){ctx.strokeStyle=`rgba(255,80,80,${.25+.6*(1-d.ai.t/.9)})`;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(mx,my);ctx.lineTo(mx+ca*1400,my+sa*1400);ctx.stroke()}
    if(d.human&&state==='play'){ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=3;ctx.setLineDash([6,9]);ctx.beginPath();ctx.moveTo(mx+ca*8,my+sa*8);ctx.lineTo(mx+ca*110,my+sa*110);ctx.stroke();ctx.setLineDash([])}
  }
  for(const d of dolls)if(!d.gone)drawDoll(d);
  ctx.lineCap='round';
  for(const b of bullets){
    const t=b.trail;
    if(t.length>=4){ctx.strokeStyle=b.g.rocket?'rgba(255,170,90,.7)':'rgba(255,236,170,.75)';ctx.lineWidth=b.g.rocket?5:b.g.id==='sniper'?4:3;ctx.beginPath();ctx.moveTo(t[0],t[1]);for(let i=2;i<t.length;i+=2)ctx.lineTo(t[i],t[i+1]);ctx.stroke()}
    ctx.fillStyle=b.g.rocket?'#4c6b2f':'#fff';ctx.beginPath();ctx.arc(b.x,b.y,b.g.rocket?7:3,0,7);ctx.fill();
  }
  for(const q of parts){ctx.globalAlpha=Math.max(0,q.life/q.max);ctx.fillStyle=q.col;ctx.fillRect(q.x-q.size/2,q.y-q.size/2,q.size,q.size)}
  ctx.globalAlpha=1;
  for(const t of texts){ctx.globalAlpha=Math.max(0,1-t.t/1.1);label(t.txt,t.x,t.y,t.size,t.col)}
  ctx.globalAlpha=1;ctx.translate(-sx,-sy);
  if(state==='play'||state==='pause'||state==='over'){
    if(mode==='solo'){
      label('WAVE '+wave,W/2,40,30);label(save.coins+' coins',W-22,40,26,'#ffcf4a','right');
      for(const s of slotRects()){
        const g=GUNS[s.i],on=player.gun===s.i;
        ctx.fillStyle=on?'rgba(55,214,192,.92)':'rgba(18,12,26,.6)';ctx.fillRect(s.x,s.y,s.w,s.h);
        ctx.font='900 17px system-ui,sans-serif';ctx.textAlign='left';ctx.fillStyle=on?'#12202a':'#fff';ctx.fillText(g.name,s.x+9,s.y+23);
        ctx.font='700 13px system-ui,sans-serif';ctx.globalAlpha=.75;ctx.fillText('key '+(s.i+1),s.x+9,s.y+43);ctx.globalAlpha=1;
      }
      if(hintT>0&&wave===1){ctx.globalAlpha=Math.min(1,hintT);label('Aim with the mouse  ·  Click to shoot  ·  R reloads  ·  A / D waddle',W/2,H-64,22);label('Every shot kicks you back. Don\'t fall off!',W/2,H-32,22,'#ffcf4a');ctx.globalAlpha=1}
    }else{
      label(score[0]+'',W/2-44,48,44,'#37d6c0');label('-',W/2,46,36);label(score[1]+'',W/2+44,48,44,'#ffb23e');
      label(GUNS[player.gun].name,24,H-22,22,'#37d6c0','left');label(GUNS[p2.gun].name,W-24,H-22,22,'#ffb23e','right');
      if(hintT>0){ctx.globalAlpha=Math.min(1,hintT);label('W / S aim   D shoot   A swap gun',24,H-52,18,'#fff','left');label('UP / DOWN aim   LEFT shoot   RIGHT swap gun',W-24,H-52,18,'#fff','right');ctx.globalAlpha=1}
    }
    if(bannerT>0&&state==='play'){ctx.globalAlpha=Math.min(1,bannerT*2);label(banner,W/2,H/2-120,72,'#ffcf4a');ctx.globalAlpha=1}
  }
  shake*=.86;if(shake<.3)shake=0;
}

/* ---------- loop ---------- */
let last=performance.now(),acc=0;
function frame(t){
  const dt=Math.min(.05,(t-last)/1000);last=t;
  if(state!=='pause'){
    acc+=dt*(slowmo>0?.3:1);slowmo-=dt;
    let n=0;while(acc>=h&&n++<12){step();acc-=h}
    if(n>=12)acc=0;
  }
  draw();requestAnimationFrame(frame);
}
toMenu();requestAnimationFrame(frame);
</script>
